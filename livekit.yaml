# ==============================================================================
# LiveKit Server Configuration for Ankabit Virtual Classrooms
# (Used only if self-hosting LiveKit instead of LiveKit Cloud)
# ==============================================================================

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

# API Keys & Secrets for JWT Authentication
keys:
  # Configure your LiveKit API keys here or use environment variables
  your_livekit_api_key: "your_livekit_api_secret"

logging:
  level: info
