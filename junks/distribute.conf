# Release settings for the Ankabit LMS marketplace package.
APP_NAME="ankabit-lms"
SOURCE_DIR="$PROJECT_ROOT/lms"
ARCHIVE_TOP_DIR="ankabit-lms"

# Never ship credentials, generated output, local state, or release-only files.
EXCLUDES=(
  ".DS_Store"
  ".git"
  ".github"
  "node_modules"
  ".next"
  "out"
  "build"
  "dist"
  "coverage"
  "logs"
  "data"
  "MainFiles"
  "tmp"
  "junks"
  ".env*"
  "*.tsbuildinfo"
  ".vercel"
  ".vscode"
  ".idea"
  "npm-debug.log*"
  "yarn-debug.log*"
  "yarn-error.log*"
)

# .env.example and .env.production.template are explicitly retained by the
# distributor as safe setup references.
# KEEP_TMP="false"
# DEPLOY_HOST=""
# DEPLOY_USER="root"
# DEPLOY_PORT="22"
# DEPLOY_PATH="/var/www/"
# DEPLOY_SSH_KEY=""
# DEPLOY_POST_CMD=""
