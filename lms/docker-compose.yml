version: '3.8'

# ==============================================================================
# Enterprise Production Docker Orchestration for Ankabit LMS (1M+ Scale)
# Next.js 14 Standalone + MariaDB / MySQL 8 (UTF8mb4) + Redis + Caddy Auto-SSL
# ==============================================================================

networks:
  ankabit_net:
    driver: bridge

services:
  # 1. High-Performance MySQL 8 Service with Full Arabic / UTF8mb4 Support
  mysql:
    image: mysql:8.0
    container_name: ankabit_mysql
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=300
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password_2026}
      MYSQL_DATABASE: ${DB_NAME:-ankabit_lms}
      MYSQL_USER: ${DB_USER:-ankabit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-securepassword2026}
    ports:
      # Bound to localhost only to prevent direct internet exposure
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ankabit_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secure_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Redis Distributed Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: ankabit_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword2026}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ankabit_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Ankabit Enterprise Next.js Standalone App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ankabit_app
    restart: always
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "mysql://${DB_USER:-ankabit}:${DB_PASSWORD:-securepassword2026}@mysql:3306/${DB_NAME:-ankabit_lms}?connection_limit=25&pool_timeout=30"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword2026}@redis:6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ankabit_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 4. Caddy Automatic SSL Reverse Proxy & Wildcard Subdomain Router
  caddy:
    image: caddy:2-alpine
    container_name: ankabit_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    environment:
      ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-ankabit.app}
      ACME_EMAIL: ${ACME_EMAIL:-admin@ankabit.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ankabit_net

  # 5. Optional Self-Hosted LiveKit SFU (Enable with: docker compose --profile livekit up -d)
  livekit:
    image: livekit/livekit-server:v1.7
    container_name: ankabit_livekit
    restart: always
    profiles:
      - livekit
    ports:
      - "7880:7880"         # WebRTC Signaling & HTTP
      - "7881:7881"         # WebRTC TCP fallback
      - "50000-50100:50000-50100/udp" # WebRTC Media ICE UDP ports
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - ankabit_net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
