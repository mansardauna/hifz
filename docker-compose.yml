version: '3.8'

services:
  # 1. High-Performance MySQL 8 Service
  mysql:
    image: mysql:8.0
    container_name: ankabit_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ankabit_lms
      MYSQL_USER: ankabit
      MYSQL_PASSWORD: securepassword2026
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Distributed Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: ankabit_redis
    restart: always
    command: redis-server --appendonly yes --requirepass redispassword2026
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Ankabit Enterprise Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ankabit_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://ankabit:securepassword2026@mysql:3306/ankabit_lms"
      REDIS_URL: "redis://:redispassword2026@redis:6379"
      LIVEKIT_URL: "wss://hifz-hyyxyaf8.livekit.cloud"
      LIVEKIT_API_KEY: "devkey_hifz_2026"
      LIVEKIT_API_SECRET: "secret_hifz_production_webrtc_cloud_2026_super_key"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
